plugins {
    id 'com.android.application'
}
def androidKeysDirPath = System.getenv('ANDROID_KEYS_DIR') ?: rootProject.file('../android-keys').absolutePath
def androidKeysDir = new File(androidKeysDirPath)
def signingPropertiesFile = new File(androidKeysDir, 'validador-v2-signing.properties')
def signingProperties = new Properties()
if (signingPropertiesFile.isFile()) {
    signingPropertiesFile.withInputStream { signingProperties.load(it) }
}

def credentialsFor = { String flavor ->
    def storeFileName = signingProperties.getProperty("${flavor}.storeFile")
    def storePasswordFileName = signingProperties.getProperty("${flavor}.storePasswordFile")
    def keyAlias = signingProperties.getProperty("${flavor}.keyAlias")
    def keyPasswordFileName = signingProperties.getProperty("${flavor}.keyPasswordFile")
    if (![storeFileName, storePasswordFileName, keyAlias, keyPasswordFileName].every { it }) return null

    def storeFile = new File(androidKeysDir, storeFileName)
    def storePasswordFile = new File(androidKeysDir, storePasswordFileName)
    def keyPasswordFile = new File(androidKeysDir, keyPasswordFileName)
    if (![storeFile, storePasswordFile, keyPasswordFile].every { it.isFile() }) return null

    [
        storeFile: storeFile,
        storePassword: storePasswordFile.getText('UTF-8').trim(),
        keyAlias: keyAlias,
        keyPassword: keyPasswordFile.getText('UTF-8').trim(),
        storeType: 'PKCS12'
    ]
}

def freeSigningCredentials = credentialsFor('free')
def releaseSigningConfigured = freeSigningCredentials != null

def validateReleaseSigningInputs = tasks.register('validateReleaseSigningInputs') {
    doLast {
        if (!releaseSigningConfigured) {
            throw new GradleException("Signed release artifacts require the Free upload keystore and password file. Configure ${signingPropertiesFile} or set ANDROID_KEYS_DIR to the approved external signing directory.")
        }
    }
}

tasks.configureEach { task ->
    def taskName = task.name.toLowerCase(Locale.ROOT)
    def isReleaseArtifactTask = taskName.contains('release') &&
            (taskName.startsWith('assemble') || taskName.startsWith('bundle') || taskName.startsWith('connected'))
    if (isReleaseArtifactTask || taskName in ['assemble', 'bundle']) {
        task.dependsOn(validateReleaseSigningInputs)
    }
}

android {
    namespace 'br.com.helpdev.validador'
    compileSdk 36
    defaultConfig {
        applicationId "br.com.helpdev.validador.v3"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "3.0.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    if (releaseSigningConfigured) {
        signingConfigs {
            freeRelease {
                storeFile freeSigningCredentials.storeFile
                storePassword freeSigningCredentials.storePassword
                keyAlias freeSigningCredentials.keyAlias
                keyPassword freeSigningCredentials.keyPassword
                storeType freeSigningCredentials.storeType
            }
        }
    }

    flavorDimensions "default"

    productFlavors {
        free {
            dimension "default"
            applicationId "br.com.helpdev.validador.v3"
            if (releaseSigningConfigured) signingConfig signingConfigs.freeRelease
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])

    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'com.google.android.material:material:1.13.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
    freeImplementation 'com.google.android.gms:play-services-ads:25.5.0'
    freeImplementation 'com.google.android.ump:user-messaging-platform:4.0.0'
}
